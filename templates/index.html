<!DOCTYPE html>
<html lang='en'>
<head>
    <meta charset='UTF-8'>
    <title>Visitor Book App</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 600px; margin: 40px auto; padding: 20px; background: #f4f4f9; }
        h1 { color: #333; }
        form { margin-bottom: 20px; }
        input[type='text'] { padding: 10px; width: 70%; border: 1px solid #ccc; border-radius: 4px; }
        button { padding: 10px 15px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background: #0056b3; }
        ul { list-style-type: none; padding: 0; }
        li { background: white; padding: 10px; margin-bottom: 8px; border-radius: 4px; border-left: 4px solid #007bff; }
    </style>
</head>
<body>
    <h1>Visitor Book</h1>
    <form method='POST'>
        <input type='text' name='note' placeholder='Leave a note or your name...' required>
        <button type='submit'>Add Note</button>
    </form>
    <h2>Saved Notes:</h2>
    <ul>
        {% for note in notes %}
            <li>{{ note }}</li>
        {% endfor %}
    </ul>
</body>
</html>
